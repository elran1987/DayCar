<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>החממה של איתי - כיתת ניצן | מעקב יומי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Rubik', sans-serif; }
        
        .sticky-col {
            position: sticky;
            right: 0;
            z-index: 20;
            background-color: #f8fafc;
        }
        .sticky-corner {
            position: sticky;
            top: 0;
            right: 0;
            z-index: 40;
            background-color: #e2e8f0;
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen pb-12">

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 transform transition-all duration-300 opacity-0 pointer-events-none translate-y-4">
        <div class="bg-emerald-600 text-white px-5 py-2.5 rounded-full shadow-lg flex items-center space-x-2 space-x-reverse font-medium text-xs">
            <i class="fa-solid fa-circle-check text-base"></i>
            <span id="toast-msg">הנתונים נשמרו אוטומטית</span>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-sm">
                    <i class="fa-solid fa-seedling text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 leading-tight">החממה של איתי - כיתת ניצן</h1>
                    <div class="flex items-center gap-2 mt-0.5">
                        <span class="inline-flex items-center gap-1 bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded-md text-xs font-bold border border-indigo-100">
                            <i class="fa-regular fa-calendar-days"></i>
                            <span id="current-date"></span>
                        </span>
                    </div>
                </div>
            </div>

            <!-- Global Controls -->
            <div class="flex items-center gap-2 flex-wrap">
                <!-- View Mode Toggle -->
                <div class="bg-slate-100 p-1 rounded-xl flex items-center border border-slate-200">
                    <button id="btn-view-cards" onclick="setViewMode('cards')" class="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all bg-white text-indigo-600 shadow-sm">
                        <i class="fa-solid fa-grip-vertical"></i> כרטיסיות
                    </button>
                    <button id="btn-view-table" onclick="setViewMode('table')" class="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all text-slate-600 hover:text-slate-900">
                        <i class="fa-solid fa-table-cells"></i> לוח מחיק
                    </button>
                </div>

                <!-- Role Mode Toggle -->
                <div class="bg-slate-100 p-1 rounded-xl flex items-center border border-slate-200">
                    <button id="btn-role-parents" onclick="setRole('parents')" class="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all shadow-sm">
                        <i class="fa-solid fa-house-user"></i> מוד הורים
                    </button>
                    <button id="btn-role-staff" onclick="setRole('staff')" class="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all shadow-sm">
                        <i class="fa-solid fa-clipboard-user"></i> מוד צוות
                    </button>
                </div>

                <!-- Reset Day -->
                <button onclick="resetDayData()" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors" title="איפוס נתוני היום">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- Role Banner -->
        <div id="role-banner" class="mb-6 p-4 rounded-xl border flex items-center justify-between text-amber-900">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-circle-info text-lg" id="role-banner-icon"></i>
                <span class="text-sm font-medium" id="role-banner-text"></span>
            </div>
            <span class="text-xs font-semibold opacity-75 hidden sm:inline">שמירה אוטומטית פעילה ✓</span>
        </div>

        <!-- SEARCH / FILTER (Card View Only) -->
        <div id="search-container" class="mb-6">
            <div class="relative max-w-md">
                <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="search-input" oninput="renderCards()" placeholder="חפש לפי שם ילד/ה..." class="w-full pr-10 pl-4 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
            </div>
        </div>

        <!-- CARDS VIEW -->
        <div id="cards-view" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>

        <!-- TABLE / WHITEBOARD VIEW -->
        <div id="table-view" class="hidden">
            <!-- Scroll Controls -->
            <div class="flex items-center justify-between mb-3 bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                <span class="text-xs font-semibold text-slate-500">ניווט מהיר בלוח (15 ילדים):</span>
                <div class="flex gap-2">
                    <button onclick="scrollTable('right')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium flex items-center gap-1">
                        <i class="fa-solid fa-arrow-right"></i> ימינה
                    </button>
                    <button onclick="scrollTable('left')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium flex items-center gap-1">
                        שמאלה <i class="fa-solid fa-arrow-left"></i>
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div id="table-scroll-container" class="overflow-x-auto custom-scrollbar max-h-[70vh]">
                    <table class="w-full border-collapse text-right text-xs">
                        <thead>
                            <tr id="table-header-tr" class="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
                                <th class="p-3 w-36 min-w-[140px] sticky-corner border-l border-slate-200 shadow-[2px_0_5px_rgba(0,0,0,0.05)] text-center">
                                    קטגוריה / ילד
                                </th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-slate-200">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <script>
        const initialChildren = ["נריה", "דין", "בר", "שקד", "הלני", "לביא", "תמרה", "נטע", "עדי", "גל", "אי״ל", "ליה", "איתי", "ניב", "ריי"];
        
        let currentRole = localStorage.getItem('daycare_role') || 'parents'; 
        let currentView = 'cards';   
        let appData = {};

        // Display Date & Day
        const now = new Date();
        document.getElementById('current-date').innerText = now.toLocaleDateString('he-IL', {
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        });

        function buildInitialData() {
            const data = {};
            initialChildren.forEach((name, idx) => {
                data[idx] = {
                    id: idx,
                    name: name,
                    wakeTime: '',
                    homeFoodTime: '',
                    homeFoodText: '',
                    breakfastStatus: '',
                    breakfastNote: '',
                    morningSleepStart: '',
                    morningSleepEnd: '',
                    lunchStatus: '',
                    lunchNote: '',
                    noonSleepStart: '',
                    noonSleepEnd: '',
                    diapers: 0,
                    snackStatus: '',
                    snackNote: ''
                };
            });
            return data;
        }

        function initData() {
            try {
                const saved = localStorage.getItem('daycare_data_v8');
                if (saved) {
                    appData = JSON.parse(saved);
                    if (appData && Object.keys(appData).length === initialChildren.length) {
                        initialChildren.forEach((name, idx) => {
                            if (appData[idx]) appData[idx].name = name;
                        });
                    } else {
                        appData = buildInitialData();
                    }
                } else {
                    appData = buildInitialData();
                }
            } catch (e) {
                appData = buildInitialData();
            }
            saveToStorage(false);
        }

        function saveToStorage(showNotification = true) {
            localStorage.setItem('daycare_data_v8', JSON.stringify(appData));
            if (showNotification) {
                showToast('נשמר אוטומטית');
            }
        }

        function showToast(msg = 'הנתונים נשמרו בהצלחה!') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            }, 2000);
        }

        function resetDayData() {
            if (confirm('האם לאפס את כל הנתונים של היום?')) {
                localStorage.removeItem('daycare_data_v8');
                appData = buildInitialData();
                saveToStorage(false);
                render();
                showToast('הנתונים אופסו בהצלחה');
            }
        }

        function setRole(role) {
            currentRole = role;
            localStorage.setItem('daycare_role', role);
            
            const btnP = document.getElementById('btn-role-parents');
            const btnS = document.getElementById('btn-role-staff');
            const banner = document.getElementById('role-banner');
            const bannerIcon = document.getElementById('role-banner-icon');
            const bannerText = document.getElementById('role-banner-text');

            if (role === 'parents') {
                btnP.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all bg-amber-500 text-white shadow-sm";
                btnS.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all text-slate-600 hover:text-slate-900 bg-white";
                banner.className = "mb-6 p-4 rounded-xl border flex items-center justify-between bg-amber-50 border-amber-200 text-amber-900";
                bannerIcon.className = "fa-solid fa-circle-info text-amber-600 text-lg";
                bannerText.innerText = "מצב דיווח הורים: ניתן לעדכן שעת התעוררות ואוכל בבית בלבד.";
            } else {
                btnS.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all bg-indigo-600 text-white shadow-sm";
                btnP.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all text-slate-600 hover:text-slate-900 bg-white";
                banner.className = "mb-6 p-4 rounded-xl border flex items-center justify-between bg-indigo-50 border-indigo-200 text-indigo-900";
                bannerIcon.className = "fa-solid fa-circle-info text-indigo-600 text-lg";
                bannerText.innerText = "מצב דיווח צוות: גישה מלאה לעדכון ארוחות, שעות שינה והחלפות חיתול.";
            }
            render();
        }

        function setViewMode(view) {
            currentView = view;
            const btnC = document.getElementById('btn-view-cards');
            const btnT = document.getElementById('btn-view-table');
            const cardsV = document.getElementById('cards-view');
            const tableV = document.getElementById('table-view');
            const searchC = document.getElementById('search-container');

            if (view === 'cards') {
                btnC.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all bg-white text-indigo-600 shadow-sm";
                btnT.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all text-slate-600 hover:text-slate-900";
                cardsV.classList.remove('hidden');
                tableV.classList.add('hidden');
                searchC.classList.remove('hidden');
            } else {
                btnT.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all bg-white text-indigo-600 shadow-sm";
                btnC.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all text-slate-600 hover:text-slate-900";
                cardsV.classList.add('hidden');
                tableV.classList.remove('hidden');
                searchC.classList.add('hidden');
            }
            render();
        }

        function updateField(id, field, value) {
            if (appData[id]) {
                appData[id][field] = value;
                saveToStorage(true);
            }
        }

        function scrollTable(direction) {
            const container = document.getElementById('table-scroll-container');
            const scrollAmount = 280;
            if (direction === 'left') {
                container.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
            } else {
                container.scrollBy({ left: scrollAmount, behavior: 'smooth' });
            }
        }

        function renderCards() {
            const container = document.getElementById('cards-view');
            const query = document.getElementById('search-input')?.value.trim().toLowerCase() || '';
            container.innerHTML = '';

            Object.values(appData).forEach(child => {
                if (query && !child.name.toLowerCase().includes(query)) return;

                const isParentDisabled = currentRole === 'parents';
                const isStaffDisabled = currentRole === 'staff';

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow overflow-hidden flex flex-col justify-between";
                
                card.innerHTML = `
                    <div class="p-5">
                        <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-100">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-indigo-50 text-xl flex items-center justify-center shadow-sm border border-indigo-100">
                                    👶
                                </div>
                                <h3 class="font-bold text-lg text-slate-800">${child.name}</h3>
                            </div>
                            <span class="text-xs px-2.5 py-1 rounded-full bg-slate-100 text-slate-600 font-medium">#${child.id + 1}</span>
                        </div>

                        <div class="space-y-4">
                            <!-- Parent Section -->
                            <div class="p-3 bg-amber-50/60 rounded-xl border border-amber-100 space-y-3">
                                <div class="flex items-center justify-between text-xs font-bold text-amber-900 mb-1">
                                    <span><i class="fa-solid fa-house text-amber-600 ml-1"></i> דיווח בוקר (הורים)</span>
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="block text-[11px] text-slate-500 mb-1">שעת התעוררות</label>
                                        <input type="time" value="${child.wakeTime || ''}" ${isStaffDisabled ? 'disabled' : ''} 
                                            onchange="updateField(${child.id}, 'wakeTime', this.value)"
                                            class="w-full px-2 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-semibold focus:ring-2 focus:ring-amber-500 disabled:bg-slate-100">
                                    </div>
                                    <div>
                                        <label class="block text-[11px] text-slate-500 mb-1">אוכל בבית (שעה)</label>
                                        <input type="time" value="${child.homeFoodTime || ''}" ${isStaffDisabled ? 'disabled' : ''} 
                                            onchange="updateField(${child.id}, 'homeFoodTime', this.value)"
                                            class="w-full px-2 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-semibold focus:ring-2 focus:ring-amber-500 disabled:bg-slate-100">
                                    </div>
                                </div>
                                <div>
                                    <input type="text" placeholder="פירוט אוכל בבית (מה אכל/ה)..." value="${child.homeFoodText || ''}" ${isStaffDisabled ? 'disabled' : ''} 
                                        onchange="updateField(${child.id}, 'homeFoodText', this.value)"
                                        class="w-full px-2 py-1.5 bg-white border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-amber-500 disabled:bg-slate-100">
                                </div>
                            </div>

                            <!-- Staff Section -->
                            <div class="p-3 bg-indigo-50/50 rounded-xl border border-indigo-100 space-y-3">
                                <div class="flex items-center justify-between text-xs font-bold text-indigo-900 mb-1">
                                    <span><i class="fa-solid fa-sun text-indigo-600 ml-1"></i> מעקב במהלך היום (צוות)</span>
                                </div>

                                <div id="card-breakfast-${child.id}">
                                    ${renderMealHtml(child, 'breakfastStatus', 'breakfastNote', 'ארוחת בוקר', isParentDisabled)}
                                </div>
                                
                                <div class="pt-1 border-t border-indigo-100/60">
                                    <label class="block text-[11px] text-slate-500 mb-1">שנת בוקר (מ- עד)</label>
                                    <div class="grid grid-cols-2 gap-2">
                                        <input type="time" value="${child.morningSleepStart || ''}" ${isParentDisabled ? 'disabled' : ''} 
                                            onchange="updateField(${child.id}, 'morningSleepStart', this.value)"
                                            class="w-full px-2 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-semibold disabled:bg-slate-100">
                                        <input type="time" value="${child.morningSleepEnd || ''}" ${isParentDisabled ? 'disabled' : ''} 
                                            onchange="updateField(${child.id}, 'morningSleepEnd', this.value)"
                                            class="w-full px-2 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-semibold disabled:bg-slate-100">
                                    </div>
                                </div>

                                <div id="card-lunch-${child.id}">
                                    ${renderMealHtml(child, 'lunchStatus', 'lunchNote', 'ארוחת צהריים', isParentDisabled)}
                                </div>

                                <div class="pt-1 border-t border-indigo-100/60">
                                    <label class="block text-[11px] text-slate-500 mb-1">שנת צהריים (מ- עד)</label>
                                    <div class="grid grid-cols-2 gap-2">
                                        <input type="time" value="${child.noonSleepStart || ''}" ${isParentDisabled ? 'disabled' : ''} 
                                            onchange="updateField(${child.id}, 'noonSleepStart', this.value)"
                                            class="w-full px-2 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-semibold disabled:bg-slate-100">
                                        <input type="time" value="${child.noonSleepEnd || ''}" ${isParentDisabled ? 'disabled' : ''} 
                                            onchange="updateField(${child.id}, 'noonSleepEnd', this.value)"
                                            class="w-full px-2 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-semibold disabled:bg-slate-100">
                                    </div>
                                </div>

                                <div class="pt-1 border-t border-indigo-100/60">
                                    <label class="block text-[11px] text-slate-500 mb-1">החלפות חיתול</label>
                                    <div class="flex items-center gap-1">
                                        <button onclick="adjustDiapers(${child.id}, -1)" ${isParentDisabled ? 'disabled' : ''} class="px-2.5 py-1 bg-slate-200 rounded font-bold text-xs hover:bg-slate-300 disabled:opacity-50">-</button>
                                        <span id="diapers-val-${child.id}" class="px-3 py-1 font-bold text-xs bg-white rounded border border-slate-200 flex-1 text-center">${child.diapers || 0}</span>
                                        <button onclick="adjustDiapers(${child.id}, 1)" ${isParentDisabled ? 'disabled' : ''} class="px-2.5 py-1 bg-indigo-600 text-white rounded font-bold text-xs hover:bg-indigo-700 disabled:opacity-50">+</button>
                                    </div>
                                </div>

                                <div id="card-snack-${child.id}">
                                    ${renderMealHtml(child, 'snackStatus', 'snackNote', 'ארוחת ארבע', isParentDisabled)}
                                </div>

                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderMealHtml(child, statusKey, noteKey, title, disabled) {
            const currentStatus = child[statusKey];
            return `
                <div class="space-y-1">
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] font-semibold text-slate-700">${title}</span>
                        <div class="flex gap-1">
                            <button type="button" onclick="setMealStatus(${child.id}, '${statusKey}', 'V')" ${disabled ? 'disabled' : ''} 
                                class="w-6 h-6 rounded flex items-center justify-center text-xs font-bold transition-all ${currentStatus === 'V' ? 'bg-emerald-500 text-white shadow-sm' : 'bg-slate-100 text-slate-400 hover:bg-slate-200'}">✓</button>
                            <button type="button" onclick="setMealStatus(${child.id}, '${statusKey}', '1/2')" ${disabled ? 'disabled' : ''} 
                                class="w-6 h-6 rounded flex items-center justify-center text-xs font-bold transition-all ${currentStatus === '1/2' ? 'bg-amber-500 text-white shadow-sm' : 'bg-slate-100 text-slate-400 hover:bg-slate-200'}">½</button>
                            <button type="button" onclick="setMealStatus(${child.id}, '${statusKey}', 'X')" ${disabled ? 'disabled' : ''} 
                                class="w-6 h-6 rounded flex items-center justify-center text-xs font-bold transition-all ${currentStatus === 'X' ? 'bg-rose-500 text-white shadow-sm' : 'bg-slate-100 text-slate-400 hover:bg-slate-200'}">✕</button>
                        </div>
                    </div>
                    <input type="text" placeholder="הערה ל${title}..." value="${child[noteKey] || ''}" ${disabled ? 'disabled' : ''} 
                        onchange="updateField(${child.id}, '${noteKey}', this.value)"
                        class="w-full px-2 py-1 bg-white border border-slate-200 rounded text-[11px] focus:ring-1 focus:ring-indigo-500 disabled:bg-slate-100">
                </div>
            `;
        }

        function setMealStatus(childId, statusKey, val) {
            if (appData[childId][statusKey] === val) {
                appData[childId][statusKey] = ''; 
            } else {
                appData[childId][statusKey] = val;
            }
            saveToStorage(true);
            if (currentView === 'cards') {
                renderCards();
            } else {
                renderTable();
            }
        }

        function adjustDiapers(childId, delta) {
            let current = appData[childId].diapers || 0;
            current = Math.max(0, current + delta);
            appData[childId].diapers = current;
            saveToStorage(true);
            const span = document.getElementById(`diapers-val-${childId}`);
            if (span) span.innerText = current;
            const tableSpan = document.getElementById(`table-diapers-val-${childId}`);
            if (tableSpan) tableSpan.innerText = current;
        }

        function renderTable() {
            const headerTr = document.getElementById('table-header-tr');
            const body = document.getElementById('table-body');

            headerTr.innerHTML = `
                <th class="p-3 w-36 min-w-[140px] sticky-corner border-l border-slate-200 shadow-[2px_0_5px_rgba(0,0,0,0.05)] text-center">
                    קטגוריה / ילד
                </th>
            `;
            body.innerHTML = '';

            const childrenArr = Object.values(appData);

            childrenArr.forEach(c => {
                const th = document.createElement('th');
                th.className = "p-3 min-w-[130px] w-[130px] text-center font-bold text-indigo-900 border-l border-slate-200 bg-slate-100";
                th.innerHTML = `
                    <div class="flex items-center justify-center gap-1.5">
                        <span class="text-sm">👶</span>
                        <span class="text-xs">${c.name}</span>
                    </div>
                `;
                headerTr.appendChild(th);
            });

            const isParentDisabled = currentRole === 'parents';
            const isStaffDisabled = currentRole === 'staff';

            const rowsDef = [
                { title: 'שעת התעוררות', isParent: true, renderCell: (c) => `
                    <input type="time" value="${c.wakeTime || ''}" ${isStaffDisabled ? 'disabled' : ''} 
                        onchange="updateField(${c.id}, 'wakeTime', this.value)"
                        class="w-full px-1 py-1 bg-amber-50/50 border border-amber-200 rounded text-center text-xs font-bold focus:ring-1 focus:ring-amber-500">
                `},
                { title: 'אוכל בבית (שעה ופרוט)', isParent: true, renderCell: (c) => `
                    <div class="space-y-1">
                        <input type="time" value="${c.homeFoodTime || ''}" ${isStaffDisabled ? 'disabled' : ''} 
                            onchange="updateField(${c.id}, 'homeFoodTime', this.value)"
                            class="w-full px-1 py-0.5 border border-amber-200 rounded text-center text-xs font-semibold">
                        <input type="text" placeholder="מה אכל..." value="${c.homeFoodText || ''}" ${isStaffDisabled ? 'disabled' : ''} 
                            onchange="updateField(${c.id}, 'homeFoodText', this.value)"
                            class="w-full px-1 py-0.5 border border-amber-200 rounded text-[10px]">
                    </div>
                `},
                { title: 'ארוחת בוקר', isParent: false, renderCell: (c) => renderTableMealCell(c, 'breakfastStatus', 'breakfastNote', isParentDisabled) },
                { title: 'שנת בוקר', isParent: false, renderCell: (c) => `
                    <div class="space-y-1">
                        <input type="time" value="${c.morningSleepStart || ''}" ${isParentDisabled ? 'disabled' : ''} 
                            onchange="updateField(${c.id}, 'morningSleepStart', this.value)"
                            class="w-full px-1 py-0.5 border border-slate-200 rounded text-center text-xs">
                        <input type="time" value="${c.morningSleepEnd || ''}" ${isParentDisabled ? 'disabled' : ''} 
                            onchange="updateField(${c.id}, 'morningSleepEnd', this.value)"
                            class="w-full px-1 py-0.5 border border-slate-200 rounded text-center text-xs">
                    </div>
                `},
                { title: 'ארוחת צהריים', isParent: false, renderCell: (c) => renderTableMealCell(c, 'lunchStatus', 'lunchNote', isParentDisabled) },
                { title: 'שנת צהריים', isParent: false, renderCell: (c) => `
                    <div class="space-y-1">
                        <input type="time" value="${c.noonSleepStart || ''}" ${isParentDisabled ? 'disabled' : ''} 
                            onchange="updateField(${c.id}, 'noonSleepStart', this.value)"
                            class="w-full px-1 py-0.5 border border-slate-200 rounded text-center text-xs">
                        <input type="time" value="${c.noonSleepEnd || ''}" ${isParentDisabled ? 'disabled' : ''} 
                            onchange="updateField(${c.id}, 'noonSleepEnd', this.value)"
                            class="w-full px-1 py-0.5 border border-slate-200 rounded text-center text-xs">
                    </div>
                `},
                { title: 'החלפות חיתול', isParent: false, renderCell: (c) => `
                    <div class="flex items-center justify-center gap-1">
                        <button type="button" onclick="adjustDiapers(${c.id}, -1)" ${isParentDisabled ? 'disabled' : ''} class="w-5 h-5 bg-slate-200 rounded font-bold text-xs flex items-center justify-center">-</button>
                        <span id="table-diapers-val-${c.id}" class="font-bold text-xs w-5 text-center">${c.diapers || 0}</span>
                        <button type="button" onclick="adjustDiapers(${c.id}, 1)" ${isParentDisabled ? 'disabled' : ''} class="w-5 h-5 bg-indigo-600 text-white rounded font-bold text-xs flex items-center justify-center">+</button>
                    </div>
                `},
                { title: 'ארוחת ארבע', isParent: false, renderCell: (c) => renderTableMealCell(c, 'snackStatus', 'snackNote', isParentDisabled) }
            ];

            rowsDef.forEach(rowDef => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 transition-colors";

                const tdTitle = document.createElement('td');
                tdTitle.className = `p-2.5 font-semibold text-xs sticky-col border-l border-slate-200 shadow-[2px_0_5px_rgba(0,0,0,0.03)] ${rowDef.isParent ? 'bg-amber-50/90 text-amber-900' : 'bg-slate-50 text-slate-700'}`;
                tdTitle.innerHTML = `
                    <div class="flex items-center gap-1">
                        <i class="fa-solid ${rowDef.isParent ? 'fa-house text-amber-600' : 'fa-sun text-indigo-500'} text-[10px]"></i>
                        <span class="text-[11px]">${rowDef.title}</span>
                    </div>
                `;
                tr.appendChild(tdTitle);

                childrenArr.forEach(c => {
                    const td = document.createElement('td');
                    td.className = "p-2 min-w-[130px] w-[130px] border-l border-slate-200 text-center align-middle";
                    td.innerHTML = rowDef.renderCell(c);
                    tr.appendChild(td);
                });

                body.appendChild(tr);
            });
        }

        function renderTableMealCell(child, statusKey, noteKey, disabled) {
            const status = child[statusKey];
            return `
                <div class="space-y-1">
                    <div class="flex justify-center gap-1">
                        <button type="button" onclick="setMealStatus(${child.id}, '${statusKey}', 'V')" ${disabled ? 'disabled' : ''} 
                            class="w-5 h-5 rounded text-[10px] font-bold ${status === 'V' ? 'bg-emerald-500 text-white shadow-sm' : 'bg-slate-100 text-slate-400'}">✓</button>
                        <button type="button" onclick="setMealStatus(${child.id}, '${statusKey}', '1/2')" ${disabled ? 'disabled' : ''} 
                            class="w-5 h-5 rounded text-[10px] font-bold ${status === '1/2' ? 'bg-amber-500 text-white shadow-sm' : 'bg-slate-100 text-slate-400'}">½</button>
                        <button type="button" onclick="setMealStatus(${child.id}, '${statusKey}', 'X')" ${disabled ? 'disabled' : ''} 
                            class="w-5 h-5 rounded text-[10px] font-bold ${status === 'X' ? 'bg-rose-500 text-white shadow-sm' : 'bg-slate-100 text-slate-400'}">✕</button>
                    </div>
                    <input type="text" placeholder="הערה..." value="${child[noteKey] || ''}" ${disabled ? 'disabled' : ''} 
                        onchange="updateField(${child.id}, '${noteKey}', this.value)"
                        class="w-full px-1 py-0.5 border border-slate-200 rounded text-[10px]">
                </div>
            `;
        }

        function render() {
            if (currentView === 'cards') {
                renderCards();
            } else {
                renderTable();
            }
        }

        // Boot
        initData();
        setRole(currentRole);
    </script>
</body>
</html>
